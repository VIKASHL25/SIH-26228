version: '3.8'

networks:
  assurance-net:
    name: assurance-net
    driver: bridge

volumes:
  orderer.assurance.mod.mil:
  peer0.assurance.mod.mil:
  peer0.contributor.mod.mil:

services:
  # -------------------------------------------------------------
  # ORDERER NODE (Raft)
  # -------------------------------------------------------------
  orderer.assurance.mod.mil:
    container_name: orderer.assurance.mod.mil
    image: hyperledger/fabric-orderer:2.5.4
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./crypto-config/ordererOrganizations/assurance.mod.mil/orderers/orderer.assurance.mod.mil/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/assurance.mod.mil/orderers/orderer.assurance.mod.mil/tls/:/var/hyperledger/orderer/tls
      - orderer.assurance.mod.mil:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "7053:7053"
    networks:
      - assurance-net

  # -------------------------------------------------------------
  # ASSURANCE AUTHORITY PEER
  # -------------------------------------------------------------
  peer0.assurance.mod.mil:
    container_name: peer0.assurance.mod.mil
    image: hyperledger/fabric-peer:2.5.4
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=assurance-net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.assurance.mod.mil
      - CORE_PEER_ADDRESS=peer0.assurance.mod.mil:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.assurance.mod.mil:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.assurance.mod.mil:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.assurance.mod.mil:7051
      - CORE_PEER_LOCALMSPID=AssuranceAuthorityMSP
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/assurance.mod.mil/peers/peer0.assurance.mod.mil/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/assurance.mod.mil/peers/peer0.assurance.mod.mil/tls:/etc/hyperledger/fabric/tls
      - peer0.assurance.mod.mil:/var/hyperledger/production
    ports:
      - "7051:7051"
    networks:
      - assurance-net

  # -------------------------------------------------------------
  # CONTRIBUTOR ORG PEER
  # -------------------------------------------------------------
  peer0.contributor.mod.mil:
    container_name: peer0.contributor.mod.mil
    image: hyperledger/fabric-peer:2.5.4
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=assurance-net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.contributor.mod.mil
      - CORE_PEER_ADDRESS=peer0.contributor.mod.mil:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.contributor.mod.mil:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.contributor.mod.mil:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.contributor.mod.mil:9051
      - CORE_PEER_LOCALMSPID=ContributorOrgMSP
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/contributor.mod.mil/peers/peer0.contributor.mod.mil/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/contributor.mod.mil/peers/peer0.contributor.mod.mil/tls:/etc/hyperledger/fabric/tls
      - peer0.contributor.mod.mil:/var/hyperledger/production
    ports:
      - "9051:9051"
    networks:
      - assurance-net

  # -------------------------------------------------------------
  # CLI MANAGEMENT CONTAINER
  # -------------------------------------------------------------
  cli:
    container_name: assurance-fabric-cli
    image: hyperledger/fabric-tools:2.5.4
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.assurance.mod.mil:7051
      - CORE_PEER_LOCALMSPID=AssuranceAuthorityMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/assurance.mod.mil/peers/peer0.assurance.mod.mil/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/assurance.mod.mil/peers/peer0.assurance.mod.mil/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/assurance.mod.mil/peers/peer0.assurance.mod.mil/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/assurance.mod.mil/users/Admin@assurance.mod.mil/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config:/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/
      - ./channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ../chaincode:/opt/gopath/src/github.com/hyperledger/fabric-samples/chaincode
    depends_on:
      - orderer.assurance.mod.mil
      - peer0.assurance.mod.mil
      - peer0.contributor.mod.mil
    networks:
      - assurance-net
